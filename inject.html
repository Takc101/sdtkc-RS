<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sdtkc网络验证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"微软雅黑",sans-serif;background:#f1f5f9;display:flex;}
        /* 侧边栏 */
        .sidebar{width:220px;background:#1e293b;height:100vh;position:fixed;color:#fff;}
        .sidebar .menu-item{
            padding:16px 25px;cursor:pointer;
            transition:all 0.2s;
        }
        .sidebar .menu-item:hover,.active{background:#334155;}
        .main{margin-left:220px;width:100%;padding:30px;min-height:100vh;}
        .logo-box{text-align:center;margin-bottom:35px;}
        .logo-box img{width:120px;height:120px;border-radius:50%;object-fit:cover;}
        .upload-card{
            width:90%;max-width:550px;margin:0 auto;
            background:#fff;border-radius:12px;padding:25px;
            display:flex;align-items:center;gap:20px;
            border:1px solid #e2e8f0;
        }
        .file-icon{font-size:48px;color:#4299e1;}
        .confirm-btn{
            margin-top:25px;width:90%;max-width:550px;display:block;margin-inline:auto;
            height:50px;background:#10b981;color:#fff;border:none;
            border-radius:8px;font-size:17px;cursor:pointer;
        }
        .download-page{display:none;}
    </style>
</head>
<body>
<div class="sidebar">
    <div style="padding:20px 15px;font-size:20px;border-bottom:1px solid #334155;">sdtkc验证</div>
    <div class="menu-item active" onclick="switchPage('inject')">
        <i class="fa fa-plug"></i> 卡密对接
    </div>
    <div class="menu-item" onclick="switchPage('download')">
        <i class="fa fa-download"></i> sd项目文件下载
    </div>
</div>
<div class="main">
    <!-- 卡密对接主界面 -->
    <div id="inject-page">
        <div class="logo-box">
            <img src="sdtkc_logo.png" alt="sdtkc图标">
        </div>
        <div class="upload-card">
            <div class="file-icon"><i class="fa-solid fa-file-code"></i></div>
            <div>
                <p style="margin-bottom:12px;">选择本地sh脚本文件注入验证逻辑</p>
                <input type="file" id="shFile" accept=".sh">
            </div>
        </div>
        <button class="confirm-btn" onclick="injectSh()">确认注入验证逻辑</button>
    </div>
    <!-- sd项目文件下载页 -->
    <div id="download-page" class="download-page">
        <h3>SD项目文件下载</h3>
        <p style="margin-top:15px;">你可以自行在这里添加对应的项目文件下载链接</p>
    </div>
</div>
<script>
// 侧边栏页面切换
function switchPage(type){
    document.querySelectorAll(".menu-item").forEach(i=>i.classList.remove("active"));
    if(type === 'inject'){
        document.getElementById('inject-page').style.display='block';
        document.getElementById('download-page').style.display='none';
    }else{
        document.getElementById('inject-page').style.display='none';
        document.getElementById('download-page').style.display='block';
    }
}
// 对接卡密系统的注入逻辑
async function injectSh(){
    const fileInput = document.getElementById("shFile");
    if(!fileInput.files[0]) return alert("请先选择sh文件");
    const originCode = await fileInput.files[0].text();
    // 自动注入适配整套卡密系统的验证逻辑
    const injectCode = `#!/bin/bash
# 自动注入sdtkc卡密验证系统
GH_USER="Takc101"
GH_REPO="sdtkc-RS"
GH_CARD_PATH="card.json"
echo "===== sdtkc网络验证 ====="
read -p "请输入卡密：" input_card
all_cards=$(curl -s https://api.github.com/repos/$GH_USER/$GH_REPO/contents/$GH_CARD_PATH | jq -r '.content' | base64 -d)
check_res=$(echo $all_cards | jq -e --arg k "$input_card" '.[] | select(.key==$k and (.expire | fromdateiso8601) > now )')
if [ $? -eq 0 ];then
    echo " 卡密验证通过"
    ${originCode.slice(2)}
else
    echo " 卡密无效或已过期"
    exit 1
fi
`
    // 导出注入完成的文件
    const blob = new Blob([injectCode],{type:"text/plain"});
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download = "injected_" + fileInput.files[0].name;
    a.click();
}
</script>
</body>
</html>
