<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sdtkc 网络验证</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: system-ui, -apple-system, sans-serif;}
        :root {--bg: #f5f5f5;--card-bg: #ffffff;--text: #121212;--border: #eee;--primary: #2196F3;}
        @media (prefers-color-scheme: dark) {
            :root {--bg: #121212;--card-bg: #1e1e1e;--text: #f5f5f5;--border: #333;}
        }
        body {min-height: 100vh;background: var(--bg);color: var(--text);}
        .sidebar {position: fixed;top: 0;left: -250px;width: 250px;height: 100vh;background: var(--card-bg);box-shadow: 2px 0 12px rgba(0,0,0,0.1);transition: left 0.3s;padding: 2rem 1rem;z-index: 100;}
        .sidebar.open {left: 0;}
        .sidebar h3 {margin-bottom: 2rem;text-align: center;}
        .sidebar a {display: block;padding: 1rem;margin: 0.5rem 0;border-radius: 8px;text-decoration: none;color: var(--text);border: 1px solid var(--border);transition: all 0.2s;}
        .sidebar a:hover {background: var(--primary);color: white;}
        .menu-btn {position: fixed;top: 1rem;left: 1rem;width: 40px;height: 40px;border-radius: 8px;background: var(--primary);color: white;display: flex;align-items: center;justify-content: center;font-size: 1.5rem;cursor: pointer;z-index: 99;}
        .main {padding: 5rem 1rem 2rem;display: flex;flex-direction: column;align-items: center;}
        .logo-img {width: 150px;height: 150px;border-radius: 50%;overflow: hidden;border: 3px solid var(--primary);margin-bottom: 2rem;}
        .logo-img img {width: 100%;height: 100%;object-fit: cover;}
        .inject-card {width: 90%;max-width: 500px;padding: 2rem;border-radius: 12px;background: var(--card-bg);box-shadow: 0 2px 12px rgba(0,0,0,0.1);border: 1px solid var(--border);}
        .file-row {display: flex;align-items: center;gap: 1rem;margin-bottom: 1.5rem;}
        .file-icon {font-size: 2rem;}
        #fileInput {display: none;}
        .select-btn {margin-left: auto;padding: 0.8rem 1.5rem;border-radius: 8px;background: var(--primary);color: white;cursor: pointer;}
        #fileName {font-size: 0.9rem;}
        .inject-btn {width: 100%;padding: 1rem;border: none;border-radius: 8px;background: var(--primary);color: white;font-size: 1rem;cursor: pointer;}
        .inject-btn:disabled {background: #999;cursor: not-allowed;}
    </style>
</head>
<body>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="sidebar" id="sidebar">
        <h3>sdtkc 网络验证</h3>
        <a href="./inject.html">卡密对接</a>
        <!-- 这里改成你自己的项目下载链接 -->
        <a href="你的项目下载地址">sd 项目文件下载</a>
    </div>

    <div class="main">
        <div class="logo-img">
            <img src="./logo.png" alt="logo">
        </div>
        <div class="inject-card">
            <div class="file-row">
                <span class="file-icon">📄</span>
                <span id="fileName">未选择文件</span>
                <label for="fileInput" class="select-btn">选择SH文件</label>
                <input type="file" id="fileInput" accept=".sh">
            </div>
            <button class="inject-btn" id="injectBtn" onclick="injectCode()" disabled>确认注入</button>
        </div>
    </div>

    <script>
        // ========== 改成你自己的卡密系统地址，就是你的Pages地址 ==========
        const VERIFY_URL = "https://Takc101.github.io/sdtkc-RS/index.html";
        // ==============================================================

        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const injectBtn = document.getElementById('injectBtn');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if(selectedFile) {
                fileName.innerText = selectedFile.name;
                injectBtn.disabled = false;
            } else {
                fileName.innerText = "未选择文件";
                injectBtn.disabled = true;
            }
        });

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function injectCode() {
            if(!selectedFile) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const originalContent = e.target.result;
                // 注入的验证代码
                const injectCode = `#!/system/bin/sh
# sdtkc网络验证 自动注入
VERIFY_PWD=$(getprop ro.serialno)
RESPONSE=$(curl -s --connect-timeout 10 "${VERIFY_URL}?act=verify&pwd=$VERIFY_PWD")
CODE=$(echo $RESPONSE | grep -o '"code":[0-9]*' | cut -d: -f2)
if [ $CODE -ne 0 ]; then
    echo "验证失败：卡密错误或已过期"
    exit 1
fi

# ========== 原脚本内容 ==========
`;
                const finalContent = injectCode + originalContent;
                downloadFile(finalContent, selectedFile.name);
            };
            reader.readAsText(selectedFile);
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
