<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密管理后台</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: system-ui, -apple-system, sans-serif;}
        body {min-height: 100vh;padding: 2rem;transition: all 0.3s;background: #f5f5f5;color: #121212;}
        @media (prefers-color-scheme: dark) {body {background: #121212;color: #f5f5f5;}}
        .login-box, .admin-box {width: 90%;max-width: 800px;margin: 0 auto;padding: 2rem;border-radius: 12px;box-shadow: 0 2px 12px rgba(0,0,0,0.1);background: white;}
        @media (prefers-color-scheme: dark) {.login-box, .admin-box {background: #1e1e1e;}}
        h1 {text-align: center;margin-bottom: 1.5rem;font-size: 1.5rem;}
        .input-group {margin-bottom: 1rem;}
        label {display: block;margin-bottom: 0.5rem;}
        input, textarea {width: 100%;padding: 0.8rem;border: 1px solid #ddd;border-radius: 8px;font-size: 1rem;}
        @media (prefers-color-scheme: dark) {input, textarea {background: #2d2d2d;border-color: #3d3d3d;color: #fff;}}
        button {padding: 0.8rem 1.5rem;border: none;border-radius: 8px;background: #2196F3;color: white;font-size: 1rem;cursor-pointer;transition: background 0.2s;margin-right: 0.5rem;}
        button:hover {background: #1976D2;}
        .del-btn {background: #f44336;}
        .del-btn:hover {background: #d32f2f;}
        .card-item {padding: 1rem;margin: 1rem 0;border-radius: 8px;border: 1px solid #eee;}
        @media (prefers-color-scheme: dark) {.card-item {border-color: #333;}}
        .tip {margin: 1rem 0;color: #666;font-size: 0.9rem;}
        @media (prefers-color-scheme: dark) {.tip {color: #aaa;}}
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h1>管理员登录</h1>
        <div class="input-group">
            <input type="password" id="adminPwd" placeholder="请输入管理员密码">
        </div>
        <button onclick="login()">登录</button>
        <div id="loginTip" class="tip"></div>
    </div>

    <div class="admin-box" id="adminBox" style="display: none;">
        <h1>卡密管理</h1>
        <div class="input-group">
            <label>用户获取密码（用户输入这个密码获取卡密）</label>
            <input type="text" id="addPwd" placeholder="请设置密码">
        </div>
        <div class="input-group">
            <label>卡密内容（要给用户的内容）</label>
            <textarea id="addContent" rows="3" placeholder="请输入卡密/授权内容"></textarea>
        </div>
        <div class="input-group">
            <label>到期时间</label>
            <input type="date" id="addExpire">
        </div>
        <button onclick="addCard()">添加卡密</button>
        <div id="tip" class="tip"></div>

        <h2 style="margin: 2rem 0 1rem;font-size: 1.2rem;">已添加卡密</h2>
        <div id="cardList"></div>
    </div>

    <script>
        // ========== 配置信息，改成你自己的 ==========
        const ADMIN_PASSWORD = "5201bzcbc";
        const GITHUB_CONFIG = {
            username: "Takc101",
            repo: "sdtkc-RS",
            token: "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"
        };
        // ==========================================

        function login() {
            const pwd = document.getElementById('adminPwd').value;
            if(pwd === ADMIN_PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminBox').style.display = 'block';
                loadCards();
            } else {
                document.getElementById('loginTip').style.color = '#c62828';
                document.getElementById('loginTip').innerText = "密码错误";
            }
        }

        async function getCardData() {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/card.json`);
            const data = await res.json();
            window.currentSha = data.sha;
            return JSON.parse(decodeURIComponent(atob(data.content)));
        }

        async function saveCardData(cards) {
            const content = btoa(encodeURIComponent(JSON.stringify(cards, null, 2)));
            await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/card.json`, {
                method: 'PUT',
                headers: {Authorization: `token ${GITHUB_CONFIG.token}`},
                body: JSON.stringify({message: "update card data", content: content, sha: window.currentSha})
            });
        }

        async function loadCards() {
            const cards = await getCardData();
            const listEl = document.getElementById('cardList');
            listEl.innerHTML = '';
            cards.forEach((card, index) => {
                const item = document.createElement('div');
                item.className = 'card-item';
                item.innerHTML = `
                    <p><strong>密码：</strong>${card.pwd}</p>
                    <p><strong>卡密：</strong>${card.content}</p>
                    <p><strong>到期时间：</strong>${new Date(card.expire).toLocaleDateString()}</p>
                    <button class="del-btn" onclick="delCard(${index})">删除</button>
                `;
                listEl.appendChild(item);
            });
        }

        async function addCard() {
            const pwd = document.getElementById('addPwd').value.trim();
            const content = document.getElementById('addContent').value.trim();
            const expire = document.getElementById('addExpire').value;
            const tipEl = document.getElementById('tip');

            if(!pwd || !content || !expire) {
                tipEl.style.color = '#c62828';
                tipEl.innerText = "请填写完整信息";
                return;
            }

            try {
                const cards = await getCardData();
                cards.push({pwd, content, expire: new Date(expire).toISOString()});
                await saveCardData(cards);
                tipEl.style.color = '#2e7d32';
                tipEl.innerText = "添加成功";
                document.getElementById('addPwd').value = '';
                document.getElementById('addContent').value = '';
                loadCards();
            } catch(e) {
                tipEl.style.color = '#c62828';
                tipEl.innerText = "添加失败，请检查配置";
            }
        }

        async function delCard(index) {
            if(!confirm("确认删除这个卡密？")) return;
            try {
                const cards = await getCardData();
                cards.splice(index, 1);
                await saveCardData(cards);
                loadCards();
            } catch(e) {
                alert("删除失败");
            }
        }
    </script>
</body>
</html>
