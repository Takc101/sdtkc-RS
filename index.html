<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密获取</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: system-ui, -apple-system, sans-serif;}
        body {min-height: 100vh;display: flex;align-items: center;justify-content: center;transition: all 0.3s;background: #f5f5f5;color: #121212;}
        @media (prefers-color-scheme: dark) {body {background: #121212;color: #f5f5f5;}}
        .card {width: 90%;max-width: 400px;padding: 2rem;border-radius: 12px;box-shadow: 0 2px 12px rgba(0,0,0,0.1);background: white;}
        @media (prefers-color-scheme: dark) {.card {background: #1e1e1e;}}
        h1 {text-align: center;margin-bottom: 1.5rem;font-size: 1.5rem;}
        .input-group {margin-bottom: 1rem;}
        input {width: 100%;padding: 0.8rem;border: 1px solid #ddd;border-radius: 8px;font-size: 1rem;}
        @media (prefers-color-scheme: dark) {input {background: #2d2d2d;border-color: #3d3d3d;color: #fff;}}
        button {width: 100%;padding: 0.8rem;border: none;border-radius: 8px;background: #2196F3;color: white;font-size: 1rem;cursor-pointer;transition: background 0.2s;}
        button:hover {background: #1976D2;}
        .result {margin-top: 1rem;padding: 1rem;border-radius: 8px;display: none;word-break: break-all;}
        .success {background: #e8f5e9;color: #2e7d32;display: block;}
        .error {background: #ffebee;color: #c62828;display: block;}
    </style>
</head>
<body>
    <div class="card">
        <h1>输入密码获取卡密</h1>
        <div class="input-group">
            <input type="text" id="pwd" placeholder="请输入你的密码">
        </div>
        <button onclick="verifyPwd()">获取卡密</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        // ========== 配置信息，改成你自己的 ==========
        const GITHUB_CONFIG = {
            username: "Takc101",
            repo: "sdtkc-RS",
            token: "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"
        };
        // ==========================================

        // 处理API请求
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('act') === 'verify') {
            const pwd = urlParams.get('pwd');
            getCardData().then(cards => {
                const res = verifyCard(pwd, cards);
                document.write(JSON.stringify(res));
            });
        }

        function verifyCard(pwd, cards) {
            const card = cards.find(c => c.pwd === pwd);
            if(!card) return {code: -1, msg: "密码错误"};
            if(new Date(card.expire) < new Date()) return {code: -2, msg: "卡密已过期"};
            return {code: 0, msg: "验证成功", content: card.content};
        }

        async function getCardData() {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/card.json`);
            const data = await res.json();
            return JSON.parse(decodeURIComponent(atob(data.content)));
        }

        async function verifyPwd() {
            const pwd = document.getElementById('pwd').value.trim();
            const resultEl = document.getElementById('result');
            if(!pwd) {
                resultEl.className = 'result error';
                resultEl.innerText = "请输入密码";
                return;
            }
            try {
                const cards = await getCardData();
                const res = verifyCard(pwd, cards);
                if(res.code === 0) {
                    resultEl.className = 'result success';
                    resultEl.innerText = `获取成功！你的卡密：${res.content}`;
                } else {
                    resultEl.className = 'result error';
                    resultEl.innerText = res.msg;
                }
            } catch(e) {
                resultEl.className = 'result error';
                resultEl.innerText = "获取数据失败，请稍后重试";
            }
        }
    </script>
</body>
</html>
